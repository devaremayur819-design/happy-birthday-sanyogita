<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:linear-gradient(-45deg,#ff4d8d,#ff8db7,#ffc4d6,#ffdfe9);
background-size:400% 400%;
animation:bg 10s ease infinite;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
width:90%;
max-width:420px;
padding:30px;
border-radius:25px;
background:rgba(255,255,255,.18);
backdrop-filter:blur(12px);
box-shadow:0 15px 35px rgba(0,0,0,.25);
text-align:center;
color:white;
animation:fade 1s;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

h1{
font-size:35px;
margin-bottom:15px;
}

p{
font-size:18px;
line-height:1.7;
margin-top:15px;
}

button{
margin-top:25px;
padding:14px 28px;
border:none;
border-radius:40px;
font-size:18px;
background:white;
color:#ff2d75;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

.heart{
position:absolute;
bottom:-30px;
font-size:24px;
animation:float linear infinite;
}

@keyframes float{
0%{
transform:translateY(0);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}
</style>

</head>

<body>

<div class="card">

<h1>🎂 Happy Birthday</h1>

<h2>Dr. Sanyogita ❤️</h2>

<p>
A little surprise made especially for you...
</p>

<button onclick="location.href='#slide2'">
Open Surprise ❤️
</button>

</div>

<script>

for(let i=0;i<30;i++){

let h=document.createElement("div");

h.className="heart";

h.innerHTML=Math.random()>0.5?"💖":"✨";

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=(5+Math.random()*5)+"s";

h.style.animationDelay=Math.random()*5+"s";

document.body.appendChild(h);

}

</script>

</body>
</html>
